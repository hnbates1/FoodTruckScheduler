name: Materialize OpenAI Files API

on:
  push:
    branches: [main]
    paths:
      - "scripts/fix-openai-file-upload-v2.mjs"
      - ".github/workflows/materialize-openai-files-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply OpenAI Files API route
        run: node scripts/fix-openai-file-upload-v2.mjs
      - name: Commit generated route
        run: |
          if git diff --quiet; then
            echo "Route already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add app/api/intake-analysis/route.ts
          git commit -m "Use OpenAI Files API for document analysis"
          git push
