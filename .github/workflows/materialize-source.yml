name: Materialize Generated Source

on:
  push:
    branches: [main]
    paths:
      - "scripts/apply-location-schedule-settings.mjs"
      - "scripts/apply-export-and-grid-fixes.mjs"
      - "scripts/add-stored-document-analysis.mjs"
      - "app/ScheduleExportRuntime.tsx"
      - "package.json"
      - ".github/workflows/materialize-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source transformations
        run: npm run prepare:source
      - name: Commit generated source
        run: |
          if git diff --quiet; then
            echo "Source already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css app/ScheduleExportRuntime.tsx app/ExistingTruckDocumentsRuntime.tsx
          git commit -m "Materialize generated application source"
          git push
