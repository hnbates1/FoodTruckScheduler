<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#061426" />
  <title>Food Truck Admin — Offline</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,#10375d 0,#07182b 42%,#030c18 100%);font-family:Arial,sans-serif;color:#f4f8ff}.card{width:min(430px,100%);padding:34px;border:1px solid #315473;border-radius:16px;background:linear-gradient(145deg,#0e2a48,#081a2f);box-shadow:0 28px 90px #0009;text-align:center}.mark{width:62px;height:62px;margin:0 auto 18px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#0e8aff,#063b93);border:1px solid #4aa6ff;font-size:28px}.eyebrow{color:#4ca2ff;font-size:11px;font-weight:800;letter-spacing:1.6px}.card h1{margin:8px 0 10px;font-size:28px}.card p{margin:0;color:#9eb4ca;font-size:13px;line-height:1.6}.card button{margin-top:24px;padding:12px 18px;border:1px solid #3196ff;border-radius:8px;background:linear-gradient(180deg,#1687ff,#0069df);color:#fff;font-weight:800;cursor:pointer}.card small{display:block;margin-top:18px;color:#6f879f;font-size:10px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">▰</div>
    <div class="eyebrow">FOOD TRUCK ADMIN</div>
    <h1>You’re Offline</h1>
    <p>The app shell is available, but live schedules, vendor profiles, documents, comments, and changes require an internet connection.</p>
    <button type="button" onclick="location.reload()">Try Again</button>
    <small>No private schedule or document data is stored by this offline page.</small>
  </main>
</body>
</html>
