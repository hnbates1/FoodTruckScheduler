name: Deploy Food Truck Admin

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: food-truck-admin-production
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  FORCE_COLOR: "0"

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Verify Cloudflare credentials
        run: npx wrangler whoami

      - name: Deploy Worker
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy-output.txt
          WORKER_URL=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' deploy-output.txt | tail -1)
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Verify workers.dev
        if: steps.deploy.outputs.worker_url != ''
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          curl --fail --show-error --silent \
            --retry 6 --retry-all-errors --retry-delay 5 \
            "$WORKER_URL/api/auth" > workers-auth.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('workers-auth.json','utf8')); if (!Object.prototype.hasOwnProperty.call(x,'needsSetup')) throw new Error('Invalid workers.dev health response');"

      - name: Verify custom domain
        run: |
          curl --fail --show-error --silent \
            --retry 6 --retry-all-errors --retry-delay 5 \
            "https://foodtruckadmin.com/api/auth" > custom-auth.json
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('custom-auth.json','utf8')); if (!Object.prototype.hasOwnProperty.call(x,'needsSetup')) throw new Error('Invalid custom-domain health response');"

      - name: Deployment summary
        run: |
          echo "## Food Truck Admin deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker: \`food-truck-admin\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Custom domain: https://foodtruckadmin.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- Existing Cloudflare runtime secrets were preserved." >> "$GITHUB_STEP_SUMMARY"
